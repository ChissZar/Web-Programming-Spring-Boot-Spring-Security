<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header" class="topbar">
    <nav style="display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 0 20px;">
        <div class="brand">
            <a th:href="@{/}">UTEShop</a>
        </div>

        <div th:if="${#authorization.expression('isAuthenticated()')}" class="account" style="display: flex; align-items: center; gap: 15px;">
            <!-- Avatar -->
            <img th:src="${#authentication.principal.images != null and !#strings.isEmpty(#authentication.principal.images) ? #authentication.principal.images : '/images/avatar-default.png'}"
                 alt="Avatar"
                 width="40"
                 height="40"
                 style="border-radius: 50%; object-fit: cover; border: 2px solid #60a5fa;">

            <!-- Full name -->
            <span th:text="${#authentication.principal.fullName}" style="font-weight: 600;">
                Nguyễn Phước Minh Triết
            </span>

            <!-- Username -->
            <span th:text="'(' + ${#authentication.principal.username} + ')'" style="color: #94a3b8;">
                (nguyenvana)
            </span>

            <!-- Email -->
            <span th:text="${#authentication.principal.email}" style="color: #cbd5e1;">
                email@gmail.com
            </span>

            <!-- Role -->
            <span th:text="${#authentication.principal.role}" style="background: #2563eb; color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: 600;">
                ROLE_USER
            </span>

            <!-- Logout -->
            <form th:action="@{/logout}" method="post" style="display:inline; margin: 0;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="link-button" style="background: #ef4444; color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: 500;">
                    Đăng xuất
                </button>
            </form>
        </div>

        <div th:unless="${#authorization.expression('isAuthenticated()')}">
            <a th:href="@{/login}" class="btn primary small">Đăng nhập</a>
        </div>
    </nav>
</header>
</body>
</html>
